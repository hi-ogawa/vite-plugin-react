name: Publish Package

on:
  push:
    branches:
      - main
    tags:
      - 'plugin-*'

permissions: {}

jobs:
  detect-rsc-release:
    if: github.repository == 'vitejs/vite-plugin-react' && github.ref == 'refs/heads/main'
    name: Detect RSC release commit
    runs-on: ubuntu-slim
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect release
        id: detect
        run: |
          SUBJECT="$(git log -1 --format=%s)"
          if [[ "$SUBJECT" != release:\ plugin-rsc@* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No RSC release commit found at HEAD"
            exit 0
          fi

          NAME="$(jq -er .name packages/plugin-rsc/package.json)"
          VERSION="$(jq -er .version packages/plugin-rsc/package.json)"
          TAG="plugin-rsc@$VERSION"
          EXPECTED="release: $TAG"
          SUFFIX="${SUBJECT#"$EXPECTED"}"

          if [[ "$NAME" != '@vitejs/plugin-rsc' ]]; then
            echo "Unexpected package name: $NAME"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION"
            exit 1
          fi
          if [[ "$SUBJECT" != "$EXPECTED" && ! "$SUFFIX" =~ ^\ \(#[0-9]+\)$ ]]; then
            echo "Release subject '$SUBJECT' does not match '$EXPECTED'"
            exit 1
          fi

          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if [[ ${#files[@]} -ne 2 ]] ||
            [[ ! " ${files[*]} " =~ " packages/plugin-rsc/package.json " ]] ||
            [[ ! " ${files[*]} " =~ " packages/plugin-rsc/CHANGELOG.md " ]]; then
            printf 'Unexpected release commit files:\n%s\n' "${files[*]}"
            exit 1
          fi

          PREVIOUS_VERSION="$(git show "$GITHUB_SHA^:packages/plugin-rsc/package.json" | jq -er .version)"
          if [[ "$PREVIOUS_VERSION" == "$VERSION" ]]; then
            echo "RSC version was not changed"
            exit 1
          fi
          if ! grep -Fq "[$VERSION]" packages/plugin-rsc/CHANGELOG.md; then
            echo "CHANGELOG.md does not contain version $VERSION"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected RSC release $TAG"

  create-rsc-tag:
    if: needs.detect-rsc-release.outputs.release == 'true'
    needs: detect-rsc-release
    name: Create RSC release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: create-rsc-release-tag
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push release tag
        env:
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TAG: ${{ needs.detect-rsc-release.outputs.tag }}
        run: |
          BOT_ID="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$BOT_ID+$APP_SLUG[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"

  publish-rsc:
    if: github.repository == 'vitejs/vite-plugin-react' && startsWith(github.ref, 'refs/tags/plugin-rsc@')
    name: Publish RSC
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Disallow installation scripts
        run: yq '.onlyBuiltDependencies = []' -i pnpm-workspace.yaml

      - name: Install deps
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Publish package
        run: npm i -g npm@^11.5.2 && pnpm run ci-publish "$GITHUB_REF_NAME"

      - if: ${{ !contains(github.ref_name, 'alpha') }}
        uses: yyx990803/release-tag@8cccf7c5aa332d71d222df46677f70f77a8d2dc0 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/vitejs/vite-plugin-react/blob/${{ github.ref_name }}/packages/plugin-rsc/CHANGELOG.md) for details.

  publish:
    if: github.repository == 'vitejs/vite-plugin-react' && github.ref_type == 'tag' && !startsWith(github.ref, 'refs/tags/plugin-rsc@')
    runs-on: ubuntu-latest
    permissions:
      contents: write # for ArnaudBarre/github-release to create a release
      id-token: write # for provenance generation
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set node version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          # disable cache, to avoid cache poisoning (https://docs.zizmor.sh/audits/#cache-poisoning)
          package-manager-cache: false

      - name: Disallow installation scripts
        run: yq '.onlyBuiltDependencies = []' -i pnpm-workspace.yaml

      - name: Install deps
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Get pkgName for tag
        id: tag
        run: |
          # Check if the tag contains "alpha"
          if [[ $GITHUB_REF_NAME =~ alpha ]]; then
            echo "isAlpha=true" >> $GITHUB_OUTPUT
          else
            echo "isAlpha=false" >> $GITHUB_OUTPUT
          fi

          # `%@*` truncates @ and version number from the right side.
          # https://stackoverflow.com/questions/9532654/expression-after-last-specific-character
          pkgName=${GITHUB_REF_NAME%@*}
          echo "pkgName=$pkgName" >> $GITHUB_OUTPUT

      - if: steps.tag.outputs.pkgName == 'plugin-react-swc'
        working-directory: packages/plugin-react-swc
        run: pnpm build

      - name: Publish package
        run: npm i -g npm@^11.5.2 && pnpm run ci-publish "$GITHUB_REF_NAME"

      - if: steps.tag.outputs.isAlpha == 'false'
        uses: ArnaudBarre/github-release@4fa6eafe8e2449c7c1c5a91ae50de4ee34db0b40 # v1.5.0
        with:
          path: packages/${{ steps.tag.outputs.pkgName }}/CHANGELOG.md
          tag-name: ${{ github.ref_name }}
